<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GhorSeba - Interactive Prototype</title>
<style>
*{box-sizing:border-box;margin:0}body{font:13px/1.45 'Segoe UI',Arial,sans-serif;color:#1f2937;background:#e2e8f0}
:root{--p:#0d9488;--pl:#ccfbf1;--e:#dc2626;--bd:#d1d5db}
#bar{position:sticky;top:0;z-index:9;background:#0f172a;color:#fff;padding:8px 12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#bar b{margin-right:8px}#bar button{background:#1e293b;color:#cbd5e1;border:0;border-radius:6px;padding:5px 9px;font-size:11.5px;cursor:pointer}#bar button.on{background:var(--p);color:#fff}
.wrap{overflow-x:auto;padding:14px}.scr{display:none;min-width:1000px;max-width:1150px;margin:0 auto}.scr.on{display:block}
.win{background:#fff;border:1px solid var(--bd);border-radius:12px;min-height:600px;overflow:hidden}
.bar{height:26px;background:#f1f5f9;display:flex;align-items:center;padding:0 10px;gap:6px;border-bottom:1px solid var(--bd)}.dot{width:9px;height:9px;border-radius:50%;background:#cbd5e1}.url{flex:1;background:#fff;border:1px solid var(--bd);border-radius:10px;padding:0 10px;font-size:11px;color:#64748b}
.nav{display:flex;align-items:center;gap:22px;padding:10px 24px;border-bottom:1px solid var(--bd)}.logo{font-size:19px;color:var(--p);cursor:pointer}.nav a{cursor:pointer}.nav a.on{font-weight:700;border-bottom:2px solid var(--p)}
.body{padding:18px 26px}.row{display:flex;gap:14px}.col{display:flex;flex-direction:column;gap:10px}.f1{flex:1}.f2{flex:2}.sp{flex:1}.c{text-align:center}.al{align-items:center}.b{font-weight:700}.sm{font-size:11.5px;color:#6b7280}
h1{font-size:30px;line-height:1.2}h2{font-size:18px}h3{font-size:14px}
.box{border:1px solid var(--bd);border-radius:10px;padding:12px;background:#fff}
.btn{display:inline-block;padding:7px 16px;border:1px solid var(--bd);border-radius:8px;font-weight:600;background:#fff;cursor:pointer;text-align:center}.btn:hover{filter:brightness(.95)}
.btn.p{background:var(--p);color:#fff;border-color:var(--p)}.btn.e{background:var(--e);color:#fff;border-color:var(--e)}.btn.w{display:block}
.in{border:1px solid var(--bd);border-radius:8px;padding:8px 10px;color:#6b7280;background:#fff}.lb{font-size:11.5px;font-weight:700;margin-bottom:3px}
.ph{background:linear-gradient(135deg,#99f6e4,#5eead4);color:#115e59;display:flex;align-items:center;justify-content:center;font-weight:700;border-radius:10px}.av{width:46px;height:46px;border-radius:50%;flex:none}
.tag{display:inline-block;padding:1px 9px;border-radius:12px;font-size:11px;font-weight:700;background:var(--pl)}.g{background:#dcfce7;color:#166534}.o{background:#fef3c7;color:#92400e}.r{background:#fee2e2;color:#991b1b}.bl{background:#dbeafe;color:#1e40af}
.st{color:#f59e0b}.grid{display:grid;gap:12px}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g6{grid-template-columns:repeat(6,1fr)}
.slot{border:1px solid var(--bd);border-radius:8px;padding:5px;text-align:center;font-size:12px;cursor:pointer}.slot.on{background:var(--p);color:#fff;font-weight:700}.slot.off{color:#aaa;text-decoration:line-through}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd)}th{background:var(--pl)}
.hero{background:var(--pl);border-radius:12px;padding:26px}.em{background:var(--e);color:#fff;border-radius:12px;padding:14px}
.bars{display:flex;align-items:flex-end;gap:8px;height:100px}.bars i{flex:1;background:var(--p);border-radius:4px 4px 0 0}
.step{width:26px;height:26px;border-radius:50%;border:1px solid var(--bd);display:inline-flex;align-items:center;justify-content:center;font-weight:700}.step.on{background:var(--p);color:#fff;border-color:var(--p)}
[data-go]{cursor:pointer}#note{text-align:center;font-size:11px;color:#64748b;padding:4px 0 18px}
</style></head><body>
<div id="bar"><b>GhorSeba prototype</b></div><div class="wrap" id="app"></div>
<div id="note">AI-generated interactive prototype. Click buttons and menu items to move between screens.</div>
<script>
const B=(t,k='',g='')=>`<span class="btn ${k}" ${g?`data-go="${g}"`:''}>${t}</span>`,
I=(l,p,s='')=>`<div style="${s}"><div class="lb">${l}</div><div class="in">${p}</div></div>`,
PH=(w,h,t='')=>`<div class="ph" style="width:${w};height:${h}">${t}</div>`,AV=i=>`<div class="ph av">${i}</div>`,
ST=n=>`<span class="st">${'★'.repeat(n)}${'☆'.repeat(5-n)}</span>`,T=(t,k='')=>`<span class="tag ${k}">${t}</span>`,
NAV=a=>`<div class="nav"><b class="logo" data-go="1">GhorSeba</b>${[['Home',1],['Find Services',3],['Emergency',11],['My Bookings',7]].map(([t,g])=>`<a data-go="${g}" class="${t==a?'on':''}">${t}</a>`).join('')}<span class="sp"></span>${B('Login','',2)}${B('Sign Up','p',2)}</div>`,
PG=(url,a,body)=>`<div class="win"><div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="url">ghorseba.com/${url}</span></div>${NAV(a)}<div class="body">${body}</div></div>`,
PC=(i,n,s,pr,ar,av)=>`<div class="box row al">${AV(i)}<div class="f1"><div class="b">${n} ${T('Verified','g')}</div><div class="sm">${s} · ${ar} · 120+ jobs</div><div>${ST(5)} <span class="sm">4.9 (86)</span></div></div><div class="c"><div class="b">${pr}</div><div class="sm">${av}</div></div><div>${B('View','',4)} ${B('Book','p',5)}</div></div>`,
STAT=l=>l.map(([a,b])=>`<div class="box c"><div class="sm">${a}</div><h2>${b}</h2></div>`).join('');
const names=['Home','Login / Register','Search','Provider Profile','Booking','Tracking','My Bookings','Review','Provider Dashboard','Admin Dashboard','Emergency'];
const S=[
()=>PG('','Home',`<div class="hero row al"><div class="f2 col"><h1>Trusted home service workers,<br>at your door.</h1><div class="sm">Verified plumbers, electricians, tutors and maids across Dhaka. Book in minutes.</div><div class="row"><div class="in f2">What service do you need?</div><div class="in f1">Area (e.g. Mirpur)</div>${B('Search','p',3)}</div></div><div class="f1"><div class="em c"><div class="b" style="font-size:16px">Emergency? Need help now!</div><div style="font-size:12px;margin:5px 0 10px">Pipe burst, power failure, gas leak</div>${B('Request Emergency Help','',11)}</div></div></div>
<h2 style="margin:16px 0 8px">Popular Services</h2><div class="grid g6">${['Plumber','Electrician','Home Tutor','Maid / Helper','AC Repair','Carpenter'].map(c=>`<div class="box c" data-go="3">${PH('100%','44px',c[0])}<div class="b" style="margin-top:6px">${c}</div></div>`).join('')}</div>
<h2 style="margin:16px 0 8px">Top Rated Providers</h2><div class="grid g3">${[['RK','Rahim Khan','Electrician, Mirpur'],['SA','Salma Akter','Home Tutor, Dhanmondi'],['JH','Jamal Hossain','Plumber, Uttara']].map(x=>`<div class="box row al" data-go="4">${AV(x[0])}<div><div class="b">${x[1]}</div><div class="sm">${x[2]}</div>${ST(5)}</div></div>`).join('')}</div>`),
()=>PG('login','',`<div class="row" style="min-height:480px"><div class="f1 col c" style="justify-content:center">${PH('100%','260px','Illustration')}<h2>Find help fast. Earn with your skills.</h2></div><div class="f1 box col" style="margin:6px 50px;align-self:center"><div class="row c"><div class="f1 b" style="border-bottom:2px solid var(--p);padding:4px">Login</div><div class="f1 sm" style="padding:4px">Register</div></div><div class="row"><div class="slot f1 on">Customer</div><div class="slot f1">Provider</div></div>${I('Phone / Email','01XXX-XXXXXX')}${I('Password','********')}${B('Login','p w',3)}${B('Continue with Google','w',3)}<div class="c sm">New here? Create an account</div></div></div>`),
()=>PG('services?area=mirpur','Find Services',`<div class="row"><div class="in f1">Electrician in Mirpur</div>${B('Search','p')}${B('Map View')}</div><div class="row" style="margin-top:12px"><div class="box col" style="width:210px;align-self:flex-start"><h3>Filters</h3><div class="lb">Category</div><div class="sm">☑ Electrician<br>☐ Plumber<br>☐ Maid / Helper</div><div class="lb">Area</div><div class="in">Mirpur</div><div class="lb">Price (Tk/hr)</div><div class="in c">200 — 800</div><div class="lb">Min. rating</div>${ST(4)}<div class="sm">☑ Available today</div>${B('Apply','p w')}</div><div class="f1 col"><div class="sm">24 providers found</div>${PC('RK','Rahim Khan','Electrician','Tk 400/hr','Mirpur 10','Available now')}${PC('MH','Mizan Hasan','Electrician','Tk 350/hr','Mirpur 1','Today 4 PM')}${PC('AB','Abdul Barek','Electrician','Tk 300/hr','Pallabi','Tomorrow')}${PC('KS','Kamal Sheikh','Electrician','Tk 450/hr','Mirpur 12','Today 6 PM')}</div></div>`),
()=>PG('providers/rahim-khan','Find Services',`<div class="row"><div class="f2 col"><div class="box row al">${PH('96px','96px','Photo')}<div class="f1"><h2>Rahim Khan ${T('Verified','g')}</h2><div class="sm">Electrician · 8 yrs experience · Mirpur, Dhaka</div><div>${ST(5)} 4.9 (86 reviews)</div><div class="sm">Response time ~10 min</div></div>${B('Chat','',6)}</div><div class="box"><h3>About</h3><div class="sm">House wiring, fan and light fitting, circuit breaker repair and emergency power fixes. Own tools, 24/7 emergency availability.</div></div><div class="box"><h3>Services &amp; Price</h3><table><tr><th>Service</th><th>Price</th></tr><tr><td>Fan / Light fitting</td><td>Tk 300</td></tr><tr><td>Wiring repair</td><td>Tk 400/hr</td></tr><tr><td>Emergency visit</td><td>Tk 700</td></tr></table></div><div class="box"><h3>Reviews</h3><div class="sm">${ST(5)} "Came within 15 minutes and fixed it fast." - Tania</div><div class="sm">${ST(4)} "Professional and polite." - Arif</div></div></div>
<div class="f1 box col" style="align-self:flex-start"><h2>Book Rahim</h2><div class="lb">Date</div><div class="grid g4"><div class="slot on">Today</div><div class="slot">Sun</div><div class="slot">Mon</div><div class="slot">Tue</div></div><div class="lb">Time</div><div class="grid g3"><div class="slot">10 AM</div><div class="slot on">12 PM</div><div class="slot off">2 PM</div><div class="slot">4 PM</div><div class="slot">6 PM</div><div class="slot">8 PM</div></div>${B('Book Now','p w',5)}<div class="sm c">Pay cash after service</div></div></div>`),
()=>PG('book/rahim-khan','Find Services',`<div class="row al" style="margin-bottom:12px"><span class="step on">1</span>Service <span class="step on">2</span><b>Schedule &amp; Details</b> <span class="step">3</span>Confirm</div><div class="row"><div class="f2 col">${I('Service type','Wiring repair ▾')}<div class="row">${I('Date','Today','flex:1')}${I('Time slot','12:00 PM - 2:00 PM ▾','flex:1')}</div>${I('Service address','House 12, Road 5, Mirpur 10, Dhaka')}${I('Problem description','Power socket sparking in bedroom...')}<div class="lb">Photo (optional)</div>${PH('130px','60px','+ Add')}<div class="lb">Payment</div><div class="row"><div class="slot on">Cash on service</div><div class="slot">bKash (soon)</div></div></div><div class="f1 box col" style="align-self:flex-start"><h3>Booking Summary</h3>${AV('RK')}<div class="b">Rahim Khan</div><div class="row sm"><span>Visit charge</span><span class="sp"></span><span>Tk 200</span></div><div class="row sm"><span>Est. work (1 hr)</span><span class="sp"></span><span>Tk 400</span></div><div class="row b"><span>Total (est.)</span><span class="sp"></span><span>Tk 600</span></div>${B('Confirm Booking','p w',6)}${B('Back','w',4)}</div></div>`),
()=>PG('bookings/BK-1042','My Bookings',`<div class="row al"><h2>Booking #BK-1042</h2>${T('On the way','o')}</div><div class="box row c" style="margin:12px 0">${[['Requested','10:02 AM',1],['Accepted','10:05 AM',1],['On the way','10:20 AM',1],['In progress','-',0],['Completed','-',0]].map((s,i)=>`<div class="f1"><span class="step ${s[2]?'on':''}">${s[2]?'✓':i+1}</span><div class="b">${s[0]}</div><div class="sm">${s[1]}</div></div>`).join('')}</div><div class="row"><div class="f1 box col"><h3>Provider</h3><div class="row al">${AV('RK')}<div><div class="b">Rahim Khan</div>${ST(5)}<div class="sm">01XXX-XXXXXX</div></div></div><div class="row">${B('Call','p',6)}${B('Chat','',6)}</div></div><div class="f1 box col"><h3>Job Details</h3><div class="sm">Wiring repair<br>Today, 12:00 PM<br>House 12, Road 5, Mirpur 10<br>Cash on service</div></div><div class="f2 box col"><h3>Live Location</h3>${PH('100%','130px','Map: provider ETA 12 min')}<div class="row">${B('Reschedule','',5)}${B('Cancel Booking','',7)}</div></div></div>`),
()=>PG('dashboard/bookings','My Bookings',`<div class="row al"><h2>My Bookings</h2><span class="sp"></span>${B('+ New Booking','p',3)}</div><div class="row" style="margin:10px 0">${T('Upcoming (2)','bl')}${T('Completed (14)')}${T('Cancelled (1)')}</div><div class="box"><table><tr><th>ID</th><th>Provider</th><th>Service</th><th>When</th><th>Status</th><th>Action</th></tr><tr><td>BK-1042</td><td>Rahim Khan</td><td>Wiring repair</td><td>Today 12 PM</td><td>${T('On the way','o')}</td><td>${B('Track','',6)}</td></tr><tr><td>BK-1040</td><td>Salma Akter</td><td>Math tutoring</td><td>Mon 5 PM</td><td>${T('Accepted','bl')}</td><td>${B('Reschedule','',5)}</td></tr><tr><td>BK-1031</td><td>Jamal Hossain</td><td>Pipe leak</td><td>2 Oct</td><td>${T('Completed','g')}</td><td>${B('Rate','p',8)}</td></tr><tr><td>BK-1025</td><td>Kamal Sheikh</td><td>Fan fitting</td><td>28 Sep</td><td>${T('Completed','g')}</td><td>${B('Rebook','',5)}</td></tr><tr><td>BK-1019</td><td>Abdul Barek</td><td>Switch repair</td><td>20 Sep</td><td>${T('Cancelled','r')}</td><td>${B('Rebook','',5)}</td></tr></table></div><div class="grid g3" style="margin-top:12px">${STAT([['Total bookings','17'],['Saved providers','5'],['Pending reviews','1']])}</div>`),
()=>PG('bookings/BK-1031/review','My Bookings',`<div class="box col c" style="width:500px;margin:14px auto;align-items:center"><h2>How was your service?</h2><div class="row al">${AV('JH')}<div style="text-align:left"><div class="b">Jamal Hossain</div><div class="sm">Pipe leak repair · 2 Oct</div></div></div><div class="st" style="font-size:34px">★★★★☆</div><div class="row">${T('On time','g')}${T('Professional','g')}${T('Fair price','g')}${T('Clean work')}</div><div style="width:100%;text-align:left"><div class="lb">Write a review</div><div class="in" style="height:80px">Share your experience...</div></div><div class="row">${B('Skip','',7)}${B('Submit Review','p',7)}</div></div>`),
()=>PG('provider/dashboard','',`<div class="row al"><h2>Welcome, Rahim</h2><span class="sp"></span>${T('Online','g')}${B('Go Offline')}</div><div class="grid g4" style="margin:10px 0">${STAT([['This month','Tk 18,400'],['Jobs done','27'],['Rating','4.9 / 5'],['Pending','3']])}</div><div class="row"><div class="f2 box col"><h3>New Booking Requests</h3>${[['Wiring repair - Mirpur 10','Today 12 PM - Tania Rahman','Normal',''],['Short circuit - Pallabi','ASAP - Arif Hasan','EMERGENCY','r'],['Fan fitting - Mirpur 1','Tomorrow 10 AM - Nila','Normal','']].map(x=>`<div class="row al" style="border-bottom:1px solid var(--bd);padding-bottom:6px"><div class="f1"><div class="b">${x[0]}</div><div class="sm">${x[1]}</div></div>${T(x[2],x[3])}${B('Decline')}${B('Accept','p')}</div>`).join('')}</div><div class="f1 box col"><h3>My Availability</h3>${[['Sat','9 AM - 8 PM'],['Sun','9 AM - 8 PM'],['Mon','9 AM - 5 PM'],['Tue','Off'],['Wed','9 AM - 8 PM'],['Thu','9 AM - 8 PM'],['Fri','Emergency only']].map(x=>`<div class="row sm"><b style="width:36px">${x[0]}</b>${x[1]}</div>`).join('')}${B('Edit Schedule')}</div></div>`),
()=>PG('admin','',`<div class="row al"><h2>Admin Panel</h2><span class="sp"></span><span class="sm">Users | Providers | Categories | Complaints | Reports</span></div><div class="grid g4" style="margin:10px 0">${STAT([['Total users','1,240'],['Verified providers','186'],['Bookings (month)','642'],['Commission','Tk 38,500']])}</div><div class="row"><div class="f1 box col"><h3>Bookings per week</h3><div class="bars"><i style="height:40%"></i><i style="height:60%"></i><i style="height:50%"></i><i style="height:85%"></i><i style="height:70%"></i><i style="height:95%"></i></div><div class="sm">Top category: Electrician</div></div><div class="f2 box"><h3>Pending Provider Verification</h3><table><tr><th>Name</th><th>Skill</th><th>Documents</th><th>Action</th></tr><tr><td>Sohel Rana</td><td>Plumber</td><td>NID, Cert.</td><td>${B('Approve','p')} ${B('Reject')}</td></tr><tr><td>Nasrin Jahan</td><td>Maid / Helper</td><td>NID, Reference</td><td>${B('Approve','p')} ${B('Reject')}</td></tr><tr><td>Billal Hossain</td><td>Electrician</td><td>NID</td><td>${B('Approve','p')} ${B('Reject')}</td></tr></table></div></div><div class="box" style="margin-top:12px"><h3>Open Complaints</h3><table><tr><td>#C-12</td><td>Provider late, no call</td><td>${T('Open','o')}</td><td>${B('Resolve')}</td></tr><tr><td>#C-11</td><td>Overcharged customer</td><td>${T('In review','bl')}</td><td>${B('Resolve')}</td></tr></table></div>`),
()=>PG('emergency','Emergency',`<div class="em row al"><div class="f1"><h2>Emergency Service Request</h2><div style="font-size:12px">Sent to all available verified providers nearby. For fire or life-threatening danger, call 999.</div></div>${B('Call 999')}</div><div class="row" style="margin-top:12px"><div class="f1 col"><div class="lb">What happened?</div><div class="grid g3"><div class="slot on">Plumbing</div><div class="slot">Electrical</div><div class="slot">Gas / Other</div></div>${I('Location','Use my current location (GPS) - Mirpur 10')}${I('Short description','Pipe burst in kitchen, water flooding...')}<div class="lb">Photo (optional)</div>${PH('110px','54px','+ Add')}${B('Send Emergency Request','e w',6)}</div><div class="f1 box col"><h3>Providers responding (live)</h3>${[['JH','Jamal Hossain','0.8','8'],['SR','Sohel Rana','1.5','15'],['MA','Masud Alam','2.2','20']].map(x=>`<div class="row al" style="border-bottom:1px solid var(--bd);padding-bottom:6px">${AV(x[0])}<div class="f1"><div class="b">${x[1]}</div><div class="sm">${ST(5)} ${x[2]} km away</div></div><div class="b">ETA ${x[3]} min</div>${B('Accept','p',6)}</div>`).join('')}${PH('100%','80px','Map')}</div></div>`)
];
document.getElementById('app').innerHTML=S.map((f,i)=>`<section class="scr" id="s${i+1}">${f()}</section>`).join('');
document.getElementById('bar').innerHTML+=names.map((n,i)=>`<button data-s="${i+1}">${i+1}. ${n}</button>`).join('');
function go(n){document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on',s.id=='s'+n));document.querySelectorAll('#bar button').forEach(b=>b.classList.toggle('on',b.dataset.s==n));history.replaceState(null,'','#'+n);window.scrollTo(0,0)}
document.addEventListener('click',e=>{const t=e.target.closest('[data-go],#bar button');if(t)go(+(t.dataset.go||t.dataset.s))});
go(+location.hash.slice(1)||1);
</script></body></html>
